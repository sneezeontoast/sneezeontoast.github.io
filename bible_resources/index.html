      line-height: 1.6;
    }

    /* ---- HERO HEADER ---- */
    header {
      background: linear-gradient(135deg, #ff512f, #dd2476);
      color: white;
      text-align: center;
      padding: 100px 20px;
      border-bottom-left-radius: 50% 10%;
      border-bottom-right-radius: 50% 10%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 5em;
      margin: 0;
      font-weight: bold;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    /* ---- SECTION ---- */
    section {
      margin: 60px auto;
      padding: 30px;
      max-width: 1000px;
      background: white;
      border-radius: 15px;

      text-align: center;
    }

    section h2 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 650px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
    }

    /* ---- BUTTONS ---- */
    .btn {
      display: inline-block;
      padding: 15px 35px;
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    footer {
      margin: 50px 0;
      text-align: center;
      font-size: 1.2em;
    }

    footer a {
      color: #dd2476;
      font-weight: bold;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
